<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface2:#EEF0F4;--text:#12141A;--muted:#596070;--border:#E3E6EB;
  --accent:#3851A3;--onAccent:#FFFFFF;--accentSoft:#E7EBF6;--good:#16A34A;--warn:#D97706;--bad:#DC2626;--gold:#B7791F;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
.retro{
  --bg:#F2EADB;--surface:#FBF6EC;--surface2:#E9DEC9;--text:#2A2018;--muted:#6E5E4C;--border:#DCCDB3;
  --accent:#A63A24;--onAccent:#FFF8EE;--accentSoft:#F0DCCD;--good:#4D7C3A;--warn:#B7791F;--bad:#A63A24;--gold:#9A6B1E;
  --shadow:0 1px 2px rgba(60,40,20,.08),0 4px 16px rgba(60,40,20,.08);
}
.retro .hl,.retro .logo,.retro .hdr h1,.retro .price{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
.dark{
  --bg:#0B0C0F;--surface:#16181D;--surface2:#24272F;--text:#F2F3F5;--muted:#A3AAB6;--border:#2A2E36;
  --accent:#E8B341;--onAccent:#1A1408;--accentSoft:#2B2416;--good:#4ADE80;--warn:#FBBF24;--bad:#F87171;--gold:#E8B341;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;overflow-x:hidden}
body{font-family:Inter,"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;background:#D9DCE3;color:var(--text);font-size:15px;line-height:1.45}
body.dark-page{background:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{max-width:100vw;color:var(--text);width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 10px #111,0 0 0 11px #333;display:flex;flex-direction:column}
@media (max-width:520px){.stage{padding:0;display:block;height:100%}.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;background:var(--bg)}
@media (max-width:520px){.statusbar{height:env(safe-area-inset-top,0px)}.statusbar span{display:none}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px}
.hdr h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1}
.hdr h2{font-size:17px;font-weight:600;flex:1;text-align:center}
.logo{font-family:"Space Grotesk";font-weight:700;font-size:24px;letter-spacing:-.03em;flex:1}
.logo b{color:var(--accent)}
.sens{position:relative;width:100%;height:100%;overflow:hidden}.sens img,.sens svg:first-child{filter:blur(18px);transform:scale(1.15)}.sens span{position:absolute;inset:auto 8px 8px 8px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px}.sens span svg{width:14px;height:14px;filter:none;transform:none}
.logoimg{display:block;width:auto;flex:none}.dark .logoimg{content:url(brand/toyscope-logo-white.svg)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative}
.ib:active{background:var(--surface2)}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.nav{position:relative;z-index:20;flex:none;display:flex;justify-content:space-around;align-items:center;height:76px;padding-bottom:14px;background:var(--surface);border-top:1px solid var(--border)}
@media (max-width:520px){.nav{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));height:auto;padding-top:8px}}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);width:64px}
.nav button.on{color:var(--text)}
.nav button.on svg{stroke:var(--accent)}
.nav svg{width:24px;height:24px}
.nav .scanbtn{width:64px;height:64px;border-radius:22px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 22px rgba(0,0,0,.18),0 0 0 5px var(--surface)}
.nav .scanbtn svg{stroke:var(--onAccent);width:30px;height:30px}
.pad{padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px}
.sec{padding:14px 16px 4px;display:flex;align-items:baseline;justify-content:space-between}
.sec h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec a,.link{color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip.wrap{white-space:normal;text-align:left;line-height:1.35;flex:initial}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dark .chip.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--onAccent)}
.btn.sec2{background:var(--surface2);color:var(--text)}
.btn.out{border:1px solid var(--border);background:var(--surface)}
.btn.sm{height:34px;padding:0 14px;border-radius:10px;font-size:13px;white-space:nowrap;flex:none}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-family:"Space Grotesk"}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:10px}
.post .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.post .art{aspect-ratio:1/1;position:relative}
.post .acts{display:flex;align-items:center;gap:4px;padding:6px 8px 0}
.post .acts .ib svg{width:25px;height:25px}
.post .body{padding:4px 14px 12px}
.liked svg{fill:#EF4444;stroke:#EF4444}
.saved svg{fill:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:11.5px;font-weight:600;white-space:nowrap;flex:none}
.b-sale{background:#0F5132;color:#fff;letter-spacing:.04em;text-transform:uppercase;font-size:11px;padding:4px 8px}
.retro .b-sale{background:#3F5A2E}.dark .b-sale{background:#E8B341;color:#1A1408}
.b-grade{background:var(--surface2);color:var(--text)}
.b-priv{background:var(--surface2);color:var(--muted)}
.b-rare{background:#1A1A1A;color:#F5C451;letter-spacing:.04em;text-transform:uppercase;font-size:11px;padding:4px 8px}
.retro .b-rare{background:#2A2018;color:#E9C46A}.dark .b-rare{background:#F5C451;color:#1A1408}
.cc{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--surface);border:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.d-private{background:#9AA1AD}.d-public{background:#3851A3}.d-sale{background:#0F7A4A}
.dark .d-public{background:#7C93FF}.retro .d-public{background:#A63A24}
.ipill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;margin:0 4px;padding:6px 10px;border-radius:12px;background:var(--surface2);cursor:pointer}
.ipill .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 16px}
.fcard{cursor:pointer}
.fcover{aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--surface2)}
.fcover>div{overflow:hidden}.fcover svg,.fcover img{width:100%;height:100%;object-fit:cover;display:block}
.fcover.one{grid-template-columns:1fr;grid-template-rows:1fr}
.fnew{aspect-ratio:1;border-radius:16px;border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.rscan{flex:none;width:112px;cursor:pointer}
.rscan .a{width:112px;height:112px;border-radius:14px;overflow:hidden;background:var(--surface2)}
.rscan .a svg,.rscan .a img{width:100%;height:100%;object-fit:cover;display:block}
.fchip{padding:9px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:14px;font-weight:500}
.fchip.on{border-color:var(--accent);background:var(--accentSoft)}
.hero{position:relative;height:300px;overflow:hidden;color:#fff}
.hero .bg{position:absolute;inset:0}.hero .bg svg,.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 35%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.7))}
.hero .top{position:absolute;left:16px;right:12px;top:10px;display:flex;align-items:center}
.hero .logo{color:#fff}.hero .logo b{color:#fff;opacity:.85}
.hero .bgbtn{width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.4);display:grid;place-items:center;color:#fff}
.hero .bgbtn svg{width:18px;height:18px}
.hero .cta{position:absolute;left:16px;right:16px;bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px 4px}
.stats div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer}
.stats b{display:block;font-family:"Space Grotesk";font-size:19px}
.retro .stats b{font-family:Fraunces,Georgia,serif}
.stats span{font-size:11.5px;color:var(--muted)}
.gcard{flex:none;width:220px;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:4/5;cursor:pointer;background:var(--surface2)}
.gcard svg{width:100%;height:100%;display:block}
.gcard .t{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;color:#fff;font-weight:700;font-size:16px;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.gcard .t small{display:block;font-weight:500;font-size:11.5px;opacity:.8;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.slot .b{width:100%;aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--border);background:var(--surface);overflow:hidden;display:grid;place-items:center;position:relative}
.slot .b img{width:100%;height:100%;object-fit:cover;display:block}
.slot.on{color:var(--text)}.slot.on .b{border:2.5px solid var(--accent)}
.slot .req{position:absolute;top:4px;right:4px;font-size:11px;font-weight:700;background:var(--accent);color:var(--onAccent);border-radius:6px;padding:1px 5px}
.coach{position:absolute;z-index:45;left:50%;transform:translateX(-50%);width:270px;background:var(--text);color:var(--bg);border-radius:16px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:fade .3s}
.coach:after{content:"";position:absolute;left:50%;margin-left:-8px;width:16px;height:16px;background:var(--text);transform:rotate(45deg)}
.coach.down:after{bottom:-7px}.coach.up:after{top:-7px}
.coach b{display:block;font-size:15px;margin-bottom:3px}.coach p{font-size:13px;opacity:.85;margin-bottom:10px}
.coach button{background:var(--bg);color:var(--text);font-weight:600;font-size:13px;padding:7px 14px;border-radius:10px}
.article p{margin:0 0 14px;font-size:15.5px;line-height:1.6}.article h4{font-size:16px;margin:18px 0 6px}
.rhero{position:relative;aspect-ratio:4/5;background:#0d0f14;overflow:hidden}
.rhero>img,.rhero>svg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.rhero>.blur{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(22px) brightness(.55);transform:scale(1.05)}
.rhero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.8))}
.rhero .hbar{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between}
.rhero .hbar .ib{background:rgba(0,0,0,.45);color:#fff;border-radius:50%}
.rhero .ttl{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.rhero .ttl .hl{font-size:28px;line-height:1.1;color:#fff}
.mcards{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.mcards::-webkit-scrollbar{display:none}
.mcard{flex:none;width:76%;scroll-snap-align:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px}
.mcard .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.mcard .n{color:var(--muted);font-size:13.5px;margin:4px 0 8px;min-height:38px}
.mcard .sc{font-family:"Space Grotesk";font-size:34px;font-weight:700;line-height:1}
.retro .mcard .sc{font-family:Fraunces,Georgia,serif}
.segs{display:flex;gap:4px;margin-top:10px}.segs i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}.segs i.on{background:var(--accent)}
.grades{display:flex;gap:6px;margin-top:6px}.grades b{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-size:16px;color:var(--muted)}
.grades b.on{background:var(--good);color:#fff}
.dtable{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2px 14px}
.dtable .r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.dtable .r:last-child{border:0}.dtable .r span:first-child{color:var(--muted);flex:none}.dtable .r span:last-child{text-align:right;font-weight:600}
.src{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.src.p{background:#DCFCE7;color:#166534}.src.a{background:#FEF3C7;color:#92400E}
.dark .src.p{background:#14361F;color:#86EFAC}.dark .src.a{background:#3A2E10;color:#FCD34D}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.coachdim{position:absolute;inset:0;z-index:44;pointer-events:none}
.obrow{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);margin-bottom:10px;cursor:pointer;font-weight:600;font-size:15px}
.obrow .ck{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:var(--muted)}
.obrow.on{border-color:var(--accent);background:var(--accentSoft)}.obrow.on .ck{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.obprog{display:flex;gap:6px;margin:4px 0 18px}.obprog i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}.obprog i.on{background:var(--text)}
/* scanning playground */
.actor{position:absolute;pointer-events:none}
.actor svg{display:block}
@keyframes fio{0%{opacity:0}12%,85%{opacity:1}100%{opacity:0}}
@keyframes punchA{0%,100%{transform:translateX(0)}40%{transform:translateX(16px) rotate(8deg)}55%{transform:translateX(0)}}
@keyframes punchB{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}60%{transform:translateX(-16px) rotate(-8deg)}75%{transform:translateX(0)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.25) rotate(20deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-14px) rotate(9deg)}}
@keyframes note{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-46px)}}
@keyframes boom{0%{transform:scale(.15);opacity:1}65%{opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes peekL{0%,100%{transform:translateX(-105%)}28%,72%{transform:translateX(-35%) rotate(8deg)}}
@keyframes peekR{0%,100%{transform:translateX(105%)}28%,72%{transform:translateX(35%) rotate(-8deg)}}
@keyframes peekB{0%,100%{transform:translateY(105%)}28%,72%{transform:translateY(40%)}}
@keyframes fall{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(var(--dx),920px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.actor{display:none}}
.rbar{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:8px}
.htabs{display:flex;gap:6px;background:var(--surface2);border-radius:12px;padding:4px;margin:0 0 10px}.htabs button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}.htabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fbadge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#E0E7FF;color:#3730A3;vertical-align:1px;white-space:nowrap}.fbadge.life{background:#FEF3C7;color:#92400E}
.b-show{background:rgba(0,0,0,.55);color:#fff}.b-offer{background:#F59E0B;color:#fff}
.rbar button{height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--border)}
.rbar button svg{width:20px;height:20px}
.rbar button.pri{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs .t{flex:none;width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative;background:var(--surface2)}

 if(sent)return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px"><div style="width:76px;height:76px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center">${ic('check',3,'width="38" height="38"')}</div><div class="hl" style="font-size:24px">Sent to ${esc(U.name.split(' ')[0])}</div><div class="muted small" style="max-width:280px">We forwarded your message by email. If ${esc(U.name.split(' ')[0])} replies, it goes straight to your inbox — neither of you sees the other’s address until someone replies.</div><div class="muted xs">You can contact ${S.contactsLeft} more collectors today.</div><button class="btn pri" style="margin-top:12px;width:200px" onclick="back()">Done</button><div class="warn b xs" style="margin-top:18px;text-align:left">${ic('info',2,'width="16" height="16" style="flex:none"')}<div>Safety: never pay by wire or gift card. ToyScope isn’t part of the sale. ${legalLink('community','Guidelines')}</div></div></div>`;
 return `<div class="hdr"><button class="ib" onclick="back()">${ic('x')}</button><h2>${t('contact')} ${esc(U.name.split(' ')[0])}</h2><div style="width:38px"></div></div>
 <div class="pad" style="padding-bottom:30px">
 ${it?`<div class="card row" style="padding:10px"><div class="art" style="width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none">${pic(it)}</div><div class="grow"><div style="font-weight:600;font-size:14px" class="ell">${esc(it.name)}</div><div class="muted xs">${stName(it.status)} · ${it.status==='sale'&&it.price?money(it.price):range(it.low,it.high)}</div></div></div>`:''}
 ${its.length>1?`<div class="chips" style="padding:10px 0 0">${its.map(x=>`<button class="chip ${x.id===sel?'on':''}" onclick="cur().p.item='${x.id}';render()">${esc(x.name.slice(0,22))}</button>`).join('')}</div>`:''}
 <label class="lbl">Your offer (optional, ${curNow()})</label><input id="offer" class="field" inputmode="numeric" placeholder="${it&&it.price?roundCur(fromUSD(toUSD(it.price,it.cur))):''}">
 <label class="lbl">Message</label><textarea id="msg" class="field" rows="5" placeholder="Write your message…" oninput="S._draft=this.value">${esc(S._draft!=null?S._draft:`Hi ${U.name.split(' ')[0]}, I’m interested in your ${it?(it.title||it.name):'collection'}. Is it still available?`)}</textarea><div class="muted xs" style="margin-top:4px">Tap the message to edit it.</div>
 <div class="warn b small" style="margin-top:14px">${ic('lock',2,'width="18" height="18" style="flex:none"')}<div><b>Your email stays hidden.</b> We forward this message. Replies come to your inbox. ${esc(U.name.split(' ')[0])}’s email is hidden too.</div></div>
 <button class="btn pri full" style="margin-top:16px" onclick="sendContact()">${ic('send',2,'width="18" height="18"')} Send</button>
 <div class="muted xs" style="text-align:center;margin-top:10px">${S.contactsLeft} of 5 contacts left today · New accounts wait 7 days</div></div>`};
function sendContact(){const m=$('msg').value.trim();if(m.length<10)return toast('Write a short message first');S._draft=$('msg').value;if(!S.signedIn)return need(()=>setTimeout(sendContact,80));if(isMinor())return needAdult(()=>{},'Contact');S._draft=null;S.contactsLeft--;cur().p.sent=true;render(true)}

SCR.hunt=()=>`<div class="hdr"><h1>${t('hunt')} <span class="badge b-v2" style="vertical-align:middle">Coming in v2</span></h1><button class="ib" onclick="toast('Add a search (v2)')">${ic('bolt',1.8)}</button></div>
 <div class="pad"><div class="card" style="padding:14px;background:linear-gradient(135deg,var(--accentSoft),var(--surface))"><div style="font-weight:700">We watch Japanese auctions for you</div><div class="muted small" style="margin-top:3px">Yahoo!オク and Mercari JP, through proxy services like Buyee. Get a push when something matching your list appears under your price.</div></div></div>
 <div class="sec"><h3>New matches</h3><span class="muted xs">Preview data</span></div>
 <div class="pad" style="display:flex;flex-direction:column;gap:10px">${MATCHES.map(m=>`<div class="card row" style="padding:10px;align-items:flex-start"><div class="art" style="width:78px;height:78px;border-radius:12px;overflow:hidden;flex:none">${art(m.art)}</div><div class="grow"><div class="small" style="font-weight:600;line-height:1.3" lang="ja">${esc(m.t)}</div><div class="row" style="margin-top:6px;gap:6px"><span class="badge b-priv">${m.src}</span><span class="muted xs">${m.left}</span></div><div class="row" style="margin-top:4px;justify-content:space-between"><span class="price">¥${m.yen.toLocaleString()} <span class="muted small" style="font-weight:500">≈ ${money(m.usd)}</span></span><button class="link small" onclick="toast('Opens on Buyee (v2)')">View</button></div></div></div>`).join('')}</div>
 <div class="sec"><h3>My watchlist</h3><span class="link" onclick="toast('Add a search (v2)')">+ Add</span></div>
 <div class="list">${WATCH.map(w=>`<div class="li"><div class="ic">${ic('search',2)}</div><div class="grow"><div style="font-weight:600;font-size:14px" lang="ja">${esc(w.q)}</div><div class="muted xs">${esc(w.en)} · under ${money(w.max)}</div></div>${w.hits?`<span class="badge b-sale">${w.hits} new</span>`:'<span class="muted xs">No matches</span>'}</div>`).join('')}</div><div style="height:20px"></div>`;

/* ---------- GUIDE ---------- */
const GUIDE=[
 {id:'g1',tag:'Buying',title:'Spotting reproductions of vintage robots',art:['tin','#9CA3AF','#475569','#E5E7EB'],body:[
  'Many classic Japanese robots and die-cast toys have been reissued, sometimes by the original maker and sometimes by others. Reissues are not fakes, but they are worth a fraction of an original, so sellers should say clearly which one it is.',
  ['Look underneath first','Originals usually carry a maker stamp and often the country of manufacture moulded or printed on the base or feet. Compare the font and position with photos from a trusted reference. Missing, blurry or re-painted stamps are a warning sign.'],
  ['Check the plastic and paint','Reissue plastic often has a different gloss or colour shade. Paint on newer pieces can look too clean and bright for a 40-year-old toy. Sticker sheets that look freshly printed deserve a closer look.'],
  ['Ask for more photos','A good seller will happily show the base, the box flaps and any accessories. If they refuse, walk away.']]},
 {id:'g2',tag:'Value',title:'Loose, boxed or mint: what condition does to price',art:['box','#DC2626','#111827','#FEE2E2'],body:[
  'Two copies of the same toy can differ in value by ten times or more. Condition is usually the biggest factor after rarity.',
  ['Loose','The toy alone, no box. Price depends on paint wear, loose joints and how many accessories are still there. A complete loose toy is worth much more than one missing its weapons.'],
  ['Boxed (opened)','Often called CIB, complete in box. The box itself adds a large share of the value for vintage Japanese toys. Inserts, instructions and unused stickers matter.'],
  ['Mint in box','Unopened or never played with. This is where the highest prices are, and also where reproductions and resealed boxes appear most often.']]},
 {id:'g3',tag:'Selling',title:'Photographing toys for a listing',art:['robot','#1E40AF','#E5E7EB','#E0E7FF'],body:[
  'Good photos sell toys faster and for more money. You do not need a studio.',
  ['Light','Shoot near a window in daylight. Avoid direct sun and flash, which hide paint detail and create glare on boxes.'],
  ['Angles','Front, back, both sides, the base with any stamps, close-ups of damage, and every accessory laid out. Buyers trust sellers who show flaws.'],
  ['Background','Plain white or grey card behind the toy. Clear away clutter so the toy is the only thing in the frame.']]},
 {id:'g4',tag:'Care',title:'Stopping yellowing and sticky plastic',art:['robot','#F8FAFC','#94A3B8','#F1F5F9'],body:[
  'White and light-grey plastic can turn yellow over time, and soft vinyl can become sticky. Both are mostly caused by light, heat and trapped air.',
  ['Keep it cool and dark','Store away from windows and heaters. A stable room temperature helps more than any product.'],
  ['Let it breathe','Sealed plastic bags can trap chemicals released by old plastic. Acid-free boxes or open shelves are safer for long-term storage.'],
  ['Be careful with fixes','Online methods to reverse yellowing can damage paint and stickers. Test on something cheap first, or ask an experienced restorer.']]},
 {id:'g5',tag:'Display',title:'Displaying toys without sun damage',art:['kaiju','#15803D','#BBF7D0','#ECFDF5'],body:[
  'A glass cabinet looks great, but it can still let in the light that fades paint and boxes.',
  ['Mind the light','Place cabinets away from windows. LED strips give off very little UV and heat compared with older bulbs.'],
  ['Dust','A closed cabinet keeps dust off. Clean with a soft brush rather than cloths that snag small parts.'],
  ['Stands','Use stands for figures with weak ankles or loose joints, so they do not lean and stress the plastic.']]},
 {id:'g6',tag:'Identify',title:'Reading maker stamps and date codes',art:['car','#7C3AED','#C4B5FD','#F5F3FF'],body:[
  'Most toys carry small markings that tell you a lot: who made it, where, and roughly when.',
  ['Where to look','Bottom of the feet, inside the legs, under a car, on the back of a figure, or on the box flaps.'],
  ['What it tells you','A maker name or logo, a country of manufacture and sometimes a copyright year. The copyright year is often the year the design was registered, not the year that copy was made.'],
  ['Scan it too','Add a photo of the base when you scan with ToyScope. It helps the AI tell originals and reissues apart.']]},
];
const gcard=g=>`<div class="gcard" onclick="go('guide',{id:'${g.id}'})">${art(g.art)}<div class="t"><small>${g.tag}</small>${esc(g.title)}</div></div>`;
SCR.guide=({id})=>{const g=GUIDE.find(x=>x.id===id);return hdrBack('Collector’s Guide')+`<div class="art" style="aspect-ratio:16/10;margin:0 16px;border-radius:20px;overflow:hidden">${art(g.art)}</div>
 <div class="pad article" style="padding-top:16px;padding-bottom:40px"><div class="muted xs" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600">${g.tag}</div><div class="hl" style="font-size:24px;line-height:1.2;margin:4px 0 14px">${esc(g.title)}</div>
 ${g.body.map(x=>typeof x==='string'?`<p>${esc(x)}</p>`:`<h4>${esc(x[0])}</h4><p>${esc(x[1])}</p>`).join('')}
 <div class="muted xs" style="margin-top:20px">General guidance only. When a toy is valuable, ask an experienced dealer or authenticator.</div></div>`};

SCR.legal=({d})=>{const L=LEGAL[d];return hdrBack(L.t)+`<div class="pad article" style="padding-bottom:40px">
 <div class="warn y small" style="margin:4px 0 14px"><div><b>Draft</b> — to be reviewed by a lawyer before launch. Text in [brackets] must be filled in.</div></div>
 <div class="muted xs" style="margin-bottom:10px">Last updated ${UPD}</div>
 ${L.s.map(([h,b])=>`<h4>${esc(h)}</h4><p style="white-space:pre-line">${esc(b)}</p>`).join('')}
 <div class="list" style="margin:20px 0 0">${Object.keys(LEGAL).filter(k=>k!==d).map(k=>`<div class="li" onclick="S.stack.pop();go('legal',{d:'${k}'})"><span class="grow">${LEGAL[k].t}</span><span class="muted">›</span></div>`).join('')}</div></div>`};

/* ---------- AGE GATE ---------- */
S.age=LS.get('age',null);S.blocked=LS.get('blocked',false);
const isMinor=()=>S.age==='13-17';

const ratingOf=it=>(it&&(it.rating||(it.ai&&it.ai.rating)||(it.album&&it.album.rating)))||'general';
const isSens=it=>ratingOf(it)==='sensitive';
const canSeeSens=()=>S.age==='18+'&&!!S.toggles.sensitive;
const sensOk=it=>!(isSens(it)&&(isMinor()||it.owner!=='me'&&false));
function feedbackSheet(){S._fb=S._fb||{kind:'bug',body:''};sheet(()=>`<h3>Report a problem or idea</h3><div class="muted small" style="margin:4px 0 12px">Tell us what happened or what you’d like. We read every message.</div>
 <div class="seg" style="margin-bottom:10px">${[['bug','Problem'],['idea','Idea']].map(([k,l])=>`<button class="${S._fb.kind===k?'on':''}" onclick="S._fb.kind='${k}';render()">${l}</button>`).join('')}</div>
 <textarea class="field" rows="5" maxlength="4000" placeholder="${S._fb.kind==='bug'?'What did you tap, and what went wrong?':'What would make ToyScope better?'}" oninput="S._fb.body=this.value" style="width:100%">${esc(S._fb.body)}</textarea>
 <button class="btn pri full" style="margin-top:12px" onclick="sendFeedback()">Send</button>`)}
async function sendFeedback(){const f=S._fb;if(!f||!f.body.trim())return toast('Write a few words first');if(!S.signedIn)return signup();
 const ok=window.LIVE&&LIVE.feedback?await LIVE.feedback({kind:f.kind,body:f.body.trim(),device:navigator.userAgent.slice(0,180),lang:S.lang}):false;
 if(ok){S._fb=null;closeSheet();toast('Thanks! We got it.')}}
function blockedSheet(){sheet(()=>`<h3>This photo can’t be shared</h3><div class="muted small" style="margin:6px 0 14px">Our automatic check found content that isn’t allowed on ToyScope, such as explicit nudity. You can keep scanning, but this item can’t be saved to your collection, shared or listed. If you think this is a mistake, email support@toyscope.app.</div><button class="btn pri full" onclick="closeSheet()">OK</button><button class="btn sec2 full" style="margin-top:6px" onclick="closeSheet();go('legal',{d:'community'})">Read the community rules</button>`)}
const isBlocked=r=>ratingOf(r)==='prohibited';
const sensImg=(a,html,u)=>a&&a.rating==='sensitive'&&!(u==='me'||canSeeSens())?`<div class="sens">${html}<span>${ic('eye',2)} Sensitive</span></div>`:html;
function needAdult(fn,what){need(()=>{if(isMinor())return sheet(()=>`<h3>Available at 18</h3><div class="muted small" style="margin:6px 0 14px">${what||'This feature'} is only for users 18 and older. You can still scan, save and learn about toys.</div><button class="btn pri full" onclick="closeSheet()">OK</button>`);fn()})}
function ageSheet(){const yNow=new Date().getFullYear();S._dob=S._dob||{m:'',y:'',news:false};sheet(()=>`<h3>When were you born?</h3><div class="muted small" style="margin-bottom:12px">We use this to keep ToyScope safe. We only keep your age range.</div>

function keySheet(){if(window.TS_SERVER)return sheet(()=>`<h3>Scan engine</h3><div class="muted small" style="margin:4px 0 12px">Choose speed or accuracy.</div><div class="seg">${[['accurate','Accurate · Gemini'],['fast','Fast · GPT']].map(([k,l])=>`<button class="${S.eng===k?'on':''}" onclick="S.eng='${k}';LS.set('eng','${k}');LS.set('aiok',false);render()">${l}</button>`).join('')}</div><div class="muted xs" style="margin-top:10px">Accurate is better with rare and Japanese toys but takes 10–30s. Fast takes about 5s. If Accurate fails, we retry with Fast automatically.</div><button class="btn pri full" style="margin-top:16px" onclick="closeSheet()">Done</button>`);sheet(()=>`<h3>Scan engine</h3><div class="muted small" style="margin:4px 0 12px">Built-in Claude (works on your phone)</div><div class="seg" style="margin-bottom:6px">${[['complex','Smart · best accuracy'],['quick','Fast']].map(([k,l])=>`<button class="${S.tier===k?'on':''}" onclick="S.tier='${k}';LS.set('tier','${k}');render()">${l}</button>`).join('')}</div><div class="muted xs" style="margin-bottom:16px">Smart takes longer (about 10–30s) but recognises rare and Japanese toys better.</div><div class="muted small" style="margin:4px 0 12px">Prototype setting. The real app keeps the key on the server.</div>
 <div class="card" style="padding:12px;margin-bottom:10px"><div class="row"><span class="engine-pill"><i></i>Now: ${engineLabel()}</span></div></div>
 <label class="lbl">OpenRouter key → GPT-5.4-mini (fastest)</label><input id="k" class="field" type="password" placeholder="sk-or-…" value="${esc(S.key)}" autocomplete="off">
 <div class="muted xs" style="margin-top:6px">Saved only in this browser on this device. Works when you open the downloaded file in Chrome. Inside the Claude link, outside connections are blocked — leave this empty there and the built-in Claude engine is used.</div>
 <div class="row" style="margin-top:14px"><button class="btn sec2" style="flex:1" onclick="S.key='';LS.set('key','');closeSheet();toast('Key removed')">Remove key</button><button class="btn pri" style="flex:1" onclick="S.key=$('k').value.trim();LS.set('key',S.key);closeSheet();toast(S.key?'GPT-5.4-mini ready':'No key')">Save</button></div>`)}
function resetProto(){try{['onboarded','interests','myitems','toggles','signedIn','anon','avatar','bg','tips','aiok','goals','age','blocked'].forEach(k=>localStorage.removeItem('ts_'+k))}catch(e){}location.reload()}

/* ===================== BOOT ===================== */
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>S.toggles.auto&&render());
S.recent=seedRecent();S.unread=true;ITEMS.forEach(i=>{if(i.owner==='me'&&!i.folder){i.folder=(i.series&&i.series!=='—'?i.series:i.brand)||'Saved';i.owned=true;if(i.status!=='sale')i.status='saved'}});buildFeed();S.liked=new Set(['f_a_r1']);if(!S.onboarded){S.stack=[{s:'welcome'}]}
render(true);maybeInstall();
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use('sample');if(s){let ok=true;try{const lim=await s.limits();ok=!!(lim&&lim.images)}catch(e){}if(ok){S.sample=s;const c=cur().s;if(['scan','settings'].includes(c))render()}}}}catch(e){}})();
</script>

<script src="live.js"></script>
