[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://deknzrajghaatahmdrwn.supabase.co; media-src 'self' blob:; connect-src 'self' https://open.er-api.com https://deknzrajghaatahmdrwn.supabase.co wss://deknzrajghaatahmdrwn.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
